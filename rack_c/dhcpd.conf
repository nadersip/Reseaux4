# dhcpd.conf

option domain-name "rack-c.local";
option domain-name-servers 10.0.199.23;

default-lease-time 600;
max-lease-time 7200;

ddns-update-style none;

subnet 172.16.50.0 netmask 255.255.255.0 {
 range 172.16.50.0 172.16.50.10;
 option routers 172.16.50.1;
 option domain-name-servers 10.0.199.23;
 option domain-name "rack-c.local";
}

subnet 172.16.60.0 netmask 255.255.255.0 {
 range 172.16.60.0 172.16.60.10;
 option routers 172.16.60.1;
 option domain-name-servers 10.0.199.23;
 option domain-name "rack-c.local";
}