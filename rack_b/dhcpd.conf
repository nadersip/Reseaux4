# dhcpd.conf

option domain-name "rack-b.local";
option domain-name-servers 10.0.199.22;

default-lease-time 600;
max-lease-time 7200;

ddns-update-style none;

subnet 172.16.30.0 netmask 255.255.255.0 {
 range 172.16.30.0 172.16.30.10;
 option routers 172.16.30.1;
 option domain-name-servers 10.0.199.22;
 option domain-name "rack-b.local";
}

subnet 172.16.40.0 netmask 255.255.255.0 {
 range 172.16.40.0 172.16.40.10;
 option routers 172.16.40.1;
 option domain-name-servers 10.0.199.22;
 option domain-name "rack-b.local";
}