- name: Updating servers and installing services
  hosts: rackservers
  become: yes

  vars:
    ansible_become_pass: "" #admin password
  tasks:
   
   - name: Servers update
     shell: sudo apt update && sudo apt upgrade -y
   
   - name: Apache2 installation
     apt:
      name: apache2
      state: present

   - name: Dnsmasq installation
     apt: 
      name: dnsmasq
      state: present

   - name : Chaning the directory cisco permission 
     file:
      path: /home/cisco
      state: directory
      mode: '0755'

   - name : Creating the hostnames.txt file for dnsmasq
     file:
      path: /home/cisco/hostnames.txt
      state: touch
      mode: '0666'

   - name : Disable systemd-resolved service
     systemd:
      name: systemd-resolved
      state: stopped
      enabled: false
     become: yes

   - name : Dnsmasq enable service
     systemd:
      name: dnsmasq
      state: restarted
      enabled: true
     become: yes

   - name: Chrony installation
     apt: 
      name: chrony
      state: present
      
   - name: TFTP installation
     apt: 
      name: tftpd-hpa
      state: present

   - name: DHCP installation
     apt: 
      name: isc-dhcp-server
      state: present

   - name: Syslog installation
     apt: 
      name: rsyslog 
      state: present

   - name: openbsd-inetd installation
     apt: 
      name: openbsd-inetd 
      state: present

   - name: telnetd installation
     apt: 
      name: telnetd 
      state: present

- name: Config for server Rack-A
  hosts: rack_a
  become: yes
  vars:
    ansible_become_pass: "" #admin password
  tasks:
    
    - name : Get the html and css code for GitHub
      get_url:
        url: "{{ item.url }}"
        dest: /var/www/html/
      loop:
        - { url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/web/index.html"}
        - { url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/web/style.css"}
        - { url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/web/surfing_gif.gif"}

    - name: Ensure SSL directory exists
      file:
        path: /etc/apache2/ssl
        state: directory
        mode: '0755'

    - name: Generate self-signed SSL certificate
      command: >
        openssl req -x509 -nodes -days 365
        -newkey rsa:2048
        -keyout /etc/apache2/ssl/apache.key
        -out /etc/apache2/ssl/apache.crt
        -subj "/C=CA/ST=ON/L=Ottawa/O=rack-a/CN=rack-a"
      args:
        creates: /etc/apache2/ssl/apache.crt

    - name : Enable HTTPS for local Apache
      apache2_module:
        name: ssl
        state: present

    - name: Enable default SSL site
      command: a2ensite default-ssl.conf

    - name : Get the ssl config file
      get_url:
        url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/web/default-ssl.conf"
        dest: /etc/apache2/sites-available/default-ssl.conf

    - name: Reload Apache
      systemd:
        name: apache2
        state: reloaded

    - name: Restart Apache
      systemd:
        name: apache2
        state: restarted

    - name : Get the dnsmasq config file
      get_url:
        url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/dns/dnsmasq-config"
        dest: /etc/dnsmasq.d/rack-a.local
    
    - name: Get hostnames.txt file
      get_url: 
        url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/dns/hostnames.txt"
        dest: /home/cisco/hostnames.txt
    
    - name : Restarting Dnsmasq service
      systemd:
        name: dnsmasq
        state: restarted
        enabled: true
      become: yes
    
    - name : Get the dhcp pool config file
      get_url:
        url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/dhcp/dhcpd.conf"
        dest: /etc/dhcp/dhcpd.conf
    
    - name : Set the dhcp interface
      get_url:
        url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/rack_a/dhcp/isc-dhcp-server"
        dest: /etc/default/isc-dhcp-server
    
    - name : Restarting dhcp service
      systemd:
        name: isc-dhcp-server
        state: restarted
        enabled: true

