- name: Updating servers and installing services
  hosts: rackservers
  become: yes

  vars:
    ansible_become_pass: "" #admin password
  tasks:
   - name: Servers update
     shell: sudo apt update && sudo apt upgrade -y
   
   - name: Apache2 installation
     apt:
      name: apache2
      state: present

   - name: Dnsmasq installation
     apt: 
      name: dnsmasq
      state: present

   - name: Chrony installation
     apt: 
      name: chrony
      state: present
      
   - name: TFTP installation
     apt: 
      name: tftpd-hpa
      state: present

   - name: DHCP installation
     apt: 
      name: isc-dhcp-server
      state: present

   - name: Syslog installation
     apt: 
      name: rsyslog 
      state: present
      
- name: Config for server Rack-A
  hosts: rack_a
  become: yes
  vars:
    ansible_become_pass: "" #admin password
  tasks:
    - name : Get the html and css code for GitHub
      get_url:
        url: "{{ item.url }}"
        dest: /var/www/html/
      loop:
        - { url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/rack_a/index.html"}
        - { url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/rack_a/style.css"}
    - name : Get the dnsmasq config file
      get_url:
        url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/rack_a/dnsmasq-config"
        dest: /etc/dnsmasq.d/rack-a.local

