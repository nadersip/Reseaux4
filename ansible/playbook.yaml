- name: Updating servers and installing services
  hosts: rackservers
  become: yes

  tasks:
   
   - name: Servers update
     shell: sudo apt update && sudo apt upgrade -y
   
   - name: Installation services Web, DNS, NTP, TFTP, DHCP, Syslog, Telnet
     apt:
      name: 
        - apache2
        - dnsmasq
        - chrony
        - tftpd-hpa
        - isc-dhcp-server
        - rsyslog
        - openbsd-inetd
        - telnetd
        - vsftpd
      state: present

   - name : Chaning the directory cisco permission 
     file:
      path: /home/cisco
      state: directory
      mode: '0755'

   - name : Creating the hostnames.txt file for dnsmasq
     file:
      path: /home/cisco/hostnames.txt
      state: touch
      mode: '0666'

   - name : Disable systemd-resolved service
     systemd:
      name: systemd-resolved
      state: stopped
      enabled: false
     ignore_errors: yes
    
   - name : Remove systemd-resolved service
     apt:
      name: systemd-resolved
      state: absent
      purge: yes

   - name: Set resolv.conf to localhost DNS
     copy:
      dest: /etc/resolv.conf
      content: |
        nameserver 127.0.0.1


   - name : Dnsmasq enable service
     systemd:
      name: dnsmasq
      state: restarted
      enabled: true


- name: Configure all servers
  hosts: rackservers
  become: yes

  vars:
    base_url: "https://raw.githubusercontent.com/nadersip/Reseaux4/refs/heads/main/servers_config/{{ rack_name }}"

  tasks:

    - name: Get web files
      get_url:
        url: "{{ base_url }}/web/{{ item }}"
        dest: /var/www/html/
      loop:
        - index.html
        - style.css
        - surfing_gif.gif

    - name: Ensure SSL directory exists
      file:
        path: /etc/apache2/ssl
        state: directory
        mode: '0755'

    - name: Generate self-signed SSL certificate
      command: >
        openssl req -x509 -nodes -days 365
        -newkey rsa:2048
        -keyout /etc/apache2/ssl/apache.key
        -out /etc/apache2/ssl/apache.crt
        -subj "/C=CA/ST=ON/L=Ottawa/O={{ rack_name }}/CN={{ rack_name }}"
      args:
        creates: /etc/apache2/ssl/apache.crt

    - name: Enable SSL module
      apache2_module:
        name: ssl
        state: present

    - name: Enable default SSL site
      command: a2ensite default-ssl.conf

    - name: Get SSL config file
      get_url:
        url: "{{ base_url }}/web/default-ssl.conf"
        dest: /etc/apache2/sites-available/default-ssl.conf

    - name: Restart Apache
      systemd:
        name: apache2
        state: restarted

    - name: Get dnsmasq zone config
      get_url:
        url: "{{ base_url }}/dns/dnsmasq-config"
        dest: "/etc/dnsmasq.d/{{ rack_name }}.local"
    
    - name: Get dnsmasq config file
      get_url:
        url: "{{ base_url }}/dns/dnsmasq.conf"
        dest: "/etc/dnsmasq.conf"

    - name: Get hostnames file
      get_url:
        url: "{{ base_url }}/dns/hostnames.txt"
        dest: /home/cisco/hostnames.txt

    - name: Restart dnsmasq
      systemd:
        name: dnsmasq
        state: restarted
        enabled: true

    - name: Get DHCP config
      get_url:
        url: "{{ base_url }}/dhcp/dhcpd.conf"
        dest: /etc/dhcp/dhcpd.conf

    - name: Set DHCP interface
      get_url:
        url: "{{ base_url }}/dhcp/isc-dhcp-server"
        dest: /etc/default/isc-dhcp-server

    - name: Restart DHCP
      systemd:
        name: isc-dhcp-server
        state: restarted
        enabled: true

    - name: Get Telnet config
      get_url:
        url: "{{ base_url }}/telnet/inetd.conf"
        dest: /etc/inetd.conf

    - name: Restart Telnet
      systemd:
        name: openbsd-inetd
        state: restarted
        enabled: true
    
    - name: Get ftp files
      get_url:
        url: "https://github.com/nadersip/Reseaux4/blob/issue_17/servers_config/rack_a/ftp/vsftpd.conf"
        dest: /etc/vsftpd.conf