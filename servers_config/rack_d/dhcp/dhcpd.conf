# dhcpd.conf

option domain-name "rack-d.local";
option domain-name-servers 192.168.40.200;

default-lease-time 600;
max-lease-time 7200;

ddns-update-style none;

subnet 172.16.70.0 netmask 255.255.255.0 {
 range 172.16.70.100 172.16.70.150;
 option routers 172.16.70.1;
 option domain-name-servers 192.168.40.200;
 option domain-name "rack-d.local";
}

subnet 172.16.80.0 netmask 255.255.255.0 {
 range 172.16.80.100 172.16.80.150;
 option routers 172.16.80.1;
 option domain-name-servers 192.168.40.200;
 option domain-name "rack-d.local";
}

subnet 192.168.40.0 netmask 255.255.255.0 {
}