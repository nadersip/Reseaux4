# dhcpd.conf

option domain-name "rack-f.local";
option domain-name-servers 192.168.60.200;

default-lease-time 600;
max-lease-time 7200;

ddns-update-style none;

subnet 172.16.110.0 netmask 255.255.255.0 {
 range 172.16.110.100 172.16.110.150;
 option routers 172.16.110.1;
 option domain-name-servers 192.168.60.200;
 option domain-name "rack-f.local";
}

subnet 172.16.120.0 netmask 255.255.255.0 {
 range 172.16.120.100 172.16.120.150;
 option routers 172.16.120.1;
 option domain-name-servers 192.168.60.200;
 option domain-name "rack-f.local";
}

subnet 192.168.60.0 netmask 255.255.255.0 {
}