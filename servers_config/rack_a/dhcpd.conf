# dhcpd.conf

option domain-name "rack-a.local";
option domain-name-servers 10.0.199.21;

default-lease-time 600;
max-lease-time 7200;

ddns-update-style none;

subnet 172.16.10.0 netmask 255.255.255.0 {
 range 172.16.10.0 172.16.10.10;
 option routers 172.16.10.1;
 option domain-name-servers 10.0.199.21;
 option domain-name "rack-a.local";
}

subnet 172.16.20.0 netmask 255.255.255.0 {
 range 172.16.20.0 172.16.20.10;
 option routers 172.16.20.1;
 option domain-name-servers 10.0.199.21;
 option domain-name "rack-a.local";
}

subnet 10.0.199.0 netmask 255.255.255.0 { 
}