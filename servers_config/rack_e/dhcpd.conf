# dhcpd.conf

option domain-name "rack-e.local";
option domain-name-servers 192.168.50.200;

default-lease-time 600;
max-lease-time 7200;

ddns-update-style none;

subnet 172.16.90.0 netmask 255.255.255.0 {
 range 172.16.90.100 172.16.90.150;
 option routers 172.16.90.1;
 option domain-name-servers 192.168.50.200;
 option domain-name "rack-e.local";
}

subnet 172.16.100.0 netmask 255.255.255.0 {
 range 172.16.100.100 172.16.100.150;
 option routers 172.16.100.1;
 option domain-name-servers 192.168.50.200;
 option domain-name "rack-e.local";
}

subnet 192.168.50.0 netmask 255.255.255.0 {
}